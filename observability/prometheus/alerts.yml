# ============================================================
# Prometheus Alert Rules — PilingTrack
# ============================================================

groups:
  # ============================================================
  # API Performance Alerts
  # ============================================================
  - name: api-performance
    rules:
      - alert: HighAPILatencyP95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="pilingtrack-app"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: pilingtrack-app
        annotations:
          summary: "p95 API latency > 500ms for 5m"
          description: "API p95 latency is {{ $value | humanizeDuration }} for the last 5 minutes on {{ $labels.instance }}"
          runbook_url: "https://wiki.pilingtrack.com/runbooks/high-api-latency"

      - alert: CriticalAPILatencyP95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="pilingtrack-app"}[5m])) > 2
        for: 2m
        labels:
          severity: critical
          service: pilingtrack-app
        annotations:
          summary: "CRITICAL: p95 API latency > 2s for 2m"
          description: "API is severely degraded. p95 = {{ $value | humanizeDuration }}"
          runbook_url: "https://wiki.pilingtrack.com/runbooks/critical-api-latency"

      - alert: HighAPIErrorRate
        expr: sum(rate(http_requests_total{job="pilingtrack-app",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="pilingtrack-app"}[5m])) > 0.01
        for: 2m
        labels:
          severity: critical
          service: pilingtrack-app
        annotations:
          summary: "API error rate > 1% for 2m"
          description: "{{ $value | humanizePercentage }} of API requests are failing with 5xx errors"
          runbook_url: "https://wiki.pilingtrack.com/runbooks/high-api-error-rate"

      - alert: APIEndpointDown
        expr: up{job="pilingtrack-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: pilingtrack-app
        annotations:
          summary: "API endpoint is DOWN"
          description: "{{ $labels.instance }} has been unreachable for 1 minute"

  # ============================================================
  # Database Alerts
  # ============================================================
  - name: database
    rules:
      - alert: PostgresHighConnectionCount
        # Exporter делит подключения по state, datname и другим labels.
        # Лимит всего экземпляра — 200 (docker-compose.prod.yml).
        expr: sum by(job, instance) (pg_stat_activity_count{job="postgresql"}) > 160
        for: 2m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "PostgreSQL connections > 160 (80% of 200)"
          description: "{{ $value }} connections across all databases out of 200 max"
          runbook_url: "https://wiki.pilingtrack.com/runbooks/postgres-connections"

      - alert: PostgresConnectionPoolExhausted
        expr: sum by(job, instance) (pg_stat_activity_count{job="postgresql"}) > 190
        for: 1m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "CRITICAL: PostgreSQL connections > 190 (95% of 200)"
          description: "{{ $value }} connections — risk of request queuing"

      # метрики нет, см. R56. pg_stat_statements не включён нигде: в Postgres нет
      # shared_preload_libraries (docker-compose.prod.yml), у postgres-exporter
      # (prometheuscommunity/postgres-exporter:latest) не включён коллектор
      # stat_statements и файла queries.yaml в репозитории нет
      # (docker-compose.monitoring-prod.yml:101-116).
      # - alert: PostgresSlowQueries
      #   expr: rate(pg_stat_statements_mean_time_seconds{datname="pilingtrack"}[5m]) > 0.3
      #   for: 5m
      #   labels:
      #     severity: warning
      #     service: postgresql
      #   annotations:
      #     summary: "PostgreSQL average query time > 300ms"
      #     description: "Average query time: {{ $value | humanizeDuration }}"

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{job="postgresql",datname!~"template0|template1|postgres"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "{{ $value }} deadlocks in the last 5 minutes"

  # ============================================================
  # Node.js / Application Alerts
  # ============================================================
  - name: application
    rules:
      - alert: HighMemoryUsage
        expr: process_heap_used_bytes / process_heap_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: nodejs
        annotations:
          summary: "Node.js heap usage > 90% for 5m"
          description: "Heap usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}"
          runbook_url: "https://wiki.pilingtrack.com/runbooks/high-memory"

      - alert: EventLoopLagHigh
        expr: nodejs_eventloop_lag_seconds > 0.1
        for: 5m
        labels:
          severity: warning
          service: nodejs
        annotations:
          summary: "Node.js event loop lag > 100ms"
          description: "Event loop lag on {{ $labels.instance }} is {{ $value | humanizeDuration }}"

      # метрики нет в приложении, см. R56
      # - alert: HighGarbageCollectionTime
      #   expr: rate(nodejs_gc_duration_seconds_sum[5m]) > 0.05
      #   for: 10m
      #   labels:
      #     severity: warning
      #     service: nodejs
      #   annotations:
      #     summary: "Excessive GC activity"
      #     description: "GC is consuming {{ $value | humanizePercentage }} of CPU time"

  # ============================================================
  # Business Logic Alerts
  # ============================================================
  - name: business-logic
    rules:
      # метрики нет в приложении, см. R56
      # - alert: NoReportsCreated
      #   expr: rate(reports_created_total[1h]) == 0
      #   for: 1h
      #   labels:
      #     severity: warning
      #     service: pilingtrack-app
      #   annotations:
      #     summary: "No reports created in the last hour"
      #     description: "Zero report creation activity — possible system issue"

      # метрики нет в приложении, см. R56
      # - alert: HighSyncFailureRate
      #   expr: rate(sync_errors_total[5m]) / rate(sync_updates_total[5m]) > 0.1
      #   for: 5m
      #   labels:
      #     severity: warning
      #     service: pilingtrack-app
      #   annotations:
      #     summary: "Sync failure rate > 10%"
      #     description: "{{ $value | humanizePercentage }} of sync operations are failing"

      - alert: OutboxBacklog
        expr: outbox_pending_count > 1000
        for: 10m
        labels:
          severity: warning
          service: pilingtrack-app
        annotations:
          summary: "Outbox event backlog > 1000"
          description: "{{ $value }} events pending processing"

      - alert: OutboxLagHigh
        # пороги скопированы из src/core/observability/lag-monitor.ts:71-76
        # (lagWarnThresholdSec=60, lagCriticalThresholdSec=300) — там они
        # уходили только в лог, F-WORKERS-SCRAPE (R59 #5).
        expr: outbox_lag_seconds > 300
        for: 5m
        labels:
          severity: critical
          service: pilingtrack-app
        annotations:
          summary: "CRITICAL: публикация outbox отстала больше чем на 5 минут"
          description: "Самое старое неопубликованное outbox-событие ждёт {{ $value }} с — воркер публикации стоит или не успевает"

      - alert: OutboxLagWarn
        expr: outbox_lag_seconds > 60
        for: 10m
        labels:
          severity: warning
          service: pilingtrack-app
        annotations:
          summary: "Публикация outbox отстала больше чем на минуту"
          description: "Самое старое неопубликованное outbox-событие ждёт {{ $value }} с (порог кода — 60 с)"

      - alert: ProjectionLagHigh
        expr: projection_lag_seconds{job="pilingtrack-app"} > 300
        for: 5m
        labels:
          severity: critical
          service: pilingtrack-app
        annotations:
          summary: "CRITICAL: проекция outbox отстала больше чем на 5 минут"
          description: "Самое старое непрожектированное событие ждёт {{ $value }} с, независимо от публикации и retry backoff"

      - alert: ProjectionLagWarn
        expr: projection_lag_seconds{job="pilingtrack-app"} > 60
        for: 10m
        labels:
          severity: warning
          service: pilingtrack-app
        annotations:
          summary: "Проекция outbox отстала больше чем на минуту"
          description: "Самое старое непрожектированное событие ждёт {{ $value }} с — проверить projection worker"

      - alert: LagSnapshotStale
        # Сбор каждые 10 с; 60 с допускают шесть циклов. 0: успешного сбора ещё не было.
        expr: time() - lag_snapshot_timestamp_seconds{job="pilingtrack-app"} > 60 or lag_snapshot_timestamp_seconds{job="pilingtrack-app"} == 0
        for: 2m
        labels:
          severity: critical
          service: pilingtrack-app
        annotations:
          summary: "Метрики outbox и проекции не обновляются"
          description: "Нет свежего успешного lag-снимка на {{ $labels.instance }} — старые нули не подтверждают здоровую очередь"

      - alert: DeadLetterQueueNotEmpty
        expr: dlq_pending_count > 0
        for: 5m
        labels:
          severity: warning
          service: pilingtrack-app
        annotations:
          summary: "Dead Letter Queue has unprocessed events"
          description: "{{ $value }} events in DLQ have exhausted retries and need manual attention"

  # ============================================================
  # Infrastructure Alerts
  # ============================================================
  - name: infrastructure
    rules:
      - alert: TargetDown
        # F-ALERT-TARGETDOWN-DEDUP (R69): alertmanager исключён — у него своё
        # правило AlertmanagerDown ниже (5m, critical). Иначе падение
        # Alertmanager давало бы две тревоги об одном и том же.
        expr: up{job!="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target {{ $labels.job }} is DOWN"
          description: "{{ $labels.instance }} has been unreachable for 2 minutes"

      - alert: WorkersDown
        # F-WORKERS-SCRAPE (R59 #3): контейнер workers — единственный, где живут
        # суточные планировщики и PDF-воркер BullMQ. Его /metrics теперь
        # scrape'ится job'ом pilingtrack-workers.
        expr: up{job="pilingtrack-workers"} == 0
        for: 5m
        labels:
          severity: critical
          service: pilingtrack-workers
        annotations:
          summary: "CRITICAL: контейнер воркеров недоступен"
          description: "{{ $labels.instance }} не отвечает 5 минут — смены не закрываются, наряды не истекают, PDF-задачи стоят в очереди"

      - alert: WorkerNotRunning
        # /metrics может отвечать 200, когда один worker не стартовал или упал.
        # Отключённые через ENABLED_WORKERS службы и работающий standby не тревожат.
        expr: worker_status{job="pilingtrack-workers"} == 0 and on(job, instance, name) worker_enabled{job="pilingtrack-workers"} == 1
        for: 2m
        labels:
          severity: critical
          service: pilingtrack-workers
        annotations:
          summary: "Включённый worker {{ $labels.name }} не работает"
          description: "{{ $labels.name }} на {{ $labels.instance }} не запущен или остановился, хотя metrics endpoint доступен"

      - alert: HealthSnapshotStale
        # Трекер обновляется каждые 15 с; 60 с допускают четыре цикла.
        # -1 означает отсутствие снимка или некорректную дату.
        expr: health_snapshot_age_seconds{job="pilingtrack-app"} > 60 or health_snapshot_age_seconds{job="pilingtrack-app"} < 0
        for: 2m
        labels:
          severity: critical
          service: pilingtrack-app
        annotations:
          summary: "Состояние системы не обновляется"
          description: "Возраст health-снимка {{ $value }} с (-1: снимок недоступен) — проверить фоновый трекер"

      - alert: HealthDegraded
        # Тот же снимок используется /api/health/deep: degraded ещё отвечает 200.
        expr: health_status{job="pilingtrack-app"} > 0
        for: 5m
        labels:
          severity: warning
          service: pilingtrack-app
        annotations:
          summary: "Система сообщает о деградации зависимостей"
          description: "Health status = {{ $value }} (1: degraded, 2: unhealthy) — проверить /api/system/status"

      - alert: AlertmanagerDown
        # F-ALERTMANAGER-WATCH (R69 #4): job `alertmanager` заведён в
        # prometheus-prod.yml, порт 9093 (docker-compose.monitoring-prod.yml:118-149).
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
          service: alertmanager
        annotations:
          summary: "CRITICAL: Alertmanager недоступен"
          description: "{{ $labels.instance }} не отвечает 5 минут — доставлять тревоги некому. Важно: это правило само уходит наружу через тот же Alertmanager, поэтому при его полном падении сообщение не придёт — такой отказ ловит внешний сторож (F-APP-GUARD), пингуя стек снаружи."

      - alert: AlertmanagerNotificationsFailing
        # F-ALERTMANAGER-WATCH (R69 #4): метрика появилась вместе с job'ом `alertmanager`
        # в prometheus-prod.yml; до этого скрейпа Alertmanager не было вообще.
        expr: rate(alertmanager_notifications_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          service: alertmanager
        annotations:
          summary: "Alertmanager не может доставить уведомления"
          description: "Alertmanager уже 15 минут стабильно получает отказы доставки ({{ $value | humanize }} сбоев/с) — тревоги не доходят до вебхука приложения/Telegram. Проверьте вебхук /api/alerts/webhook и канал Telegram."

      - alert: RedisHighMemory
        expr: (redis_memory_used_bytes / redis_memory_max_bytes > 0.8) and on(job, instance) redis_memory_max_bytes > 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage > 80%"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory"

      - alert: HostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Host disk free < 15%"
          description: "Free space on / is {{ $value | humanizePercentage }} — docker prune may be needed before next rebuild"

      - alert: HostDiskSpaceCritical
        expr: node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} < 2 * 1024 * 1024 * 1024
        for: 2m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "CRITICAL: Host disk free < 2 GB"
          description: "Only {{ $value | humanize1024 }}B free on / — Prometheus TSDB / docker builds will fail"

      - alert: BackupMissing
        expr: backup_last_success_available{job="pilingtrack-app"} == 0 and on(job, instance) backup_monitoring_enabled{job="pilingtrack-app"} == 1
        for: 30m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "Нет сведений об успешной резервной копии"
          description: "Контроль бэкапов включён, но возраст последней успешной копии отсутствует или некорректен"

      - alert: BackupStale
        # Порог совпадает с BACKUP_STALE_HOURS фонового трекера.
        expr: backup_age_hours{job="pilingtrack-app"} > 26 and on(job, instance) backup_monitoring_enabled{job="pilingtrack-app"} == 1
        for: 5m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "Резервная копия старше 26 часов"
          description: "Последняя успешная резервная копия создана {{ $value }} ч назад — проверить расписание и backup-postgres.sh"

      - alert: BackupCritical
        # Порог совпадает с BACKUP_CRITICAL_HOURS фонового трекера.
        expr: backup_age_hours{job="pilingtrack-app"} > 48 and on(job, instance) backup_monitoring_enabled{job="pilingtrack-app"} == 1
        for: 5m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "Резервная копия старше двух суток"
          description: "Последняя успешная копия создана {{ $value }} ч назад — риск потери данных при отказе базы"

      - alert: OffsiteBackupNotSynced
        # Нулевой возраст бывает у только что созданной копии, а не только
        # при выключенном контроле. Явные gauges различают эти состояния.
        expr: backup_s3_synced{job="pilingtrack-app"} == 0 and on(job, instance) backup_monitoring_enabled{job="pilingtrack-app"} == 1 and on(job, instance) backup_last_success_available{job="pilingtrack-app"} == 1
        for: 26h
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "Облачная копия базы не обновлялась больше суток"
          description: "Облачная копия базы не обновлялась больше суток — проверить rclone/R2"

