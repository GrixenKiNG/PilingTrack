name: Nightly E2E (roles x profiles)

# Ночной прогон всех основных сценариев на одноразовом стенде: боевая сборка,
# своя база с RLS, HTTPS-прокси (Secure-куки нужны WebKit), три профиля
# (chromium, Mobile Safari, Mobile Chrome), семь ролей через role-audit.
# Отчёт: сводка в карточке запуска + вложение playwright-report (трассы и видео
# упавших). Запуск вручную: Actions -> Nightly E2E -> Run workflow.
#
# Дорожка B (QA-спеки e2e/qa и e2e/qa-ac) сюда не входит: ей нужны локальная
# QA-база и матрица пользователей вне репозитория. Её ведёт ежедневный QA на
# рабочем ПК (D:/PillingR/qa/qa-daily.ps1, будни в 07:00).

on:
  schedule:
    # 03:30 UTC = 06:30 по Москве, по будням: к началу рабочего дня отчёт готов.
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: piling
          # Ephemeral service-only password, generated by the workflow run identity.
          POSTGRES_PASSWORD: codex-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: codex_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --name codex-service-${{ github.run_id }}
          --label pilingtrack.codex.test-db=1
          --health-cmd "pg_isready -h 127.0.0.1 -U piling -d codex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_PROVIDER: postgres
      DB_IDENTITY_ROLE: pilingtrack_identity
      REDIS_URL: 'redis://127.0.0.1:6379'
      SESSION_SECRET: 'ci-session-secret-32-bytes-minimum-length-for-validation-xx'
      ENCRYPTION_KEY: '11111111111111111111111111111111111111111111111111111111111111ab'
      DEVICE_KEY_LOOKUP_SECRET: 'ci-device-secret-base64-padding-here-1234567890abcdefghijklmn=='
      DEFAULT_TENANT_ID: 'ci'
      TRUST_PROXY: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      INTEGRATION_DATABASE_URL_OWNER: postgresql://piling:codex-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/codex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without environment-reading postinstall
        run: npm ci --ignore-scripts
      - name: Generate client without loading .env
        run: npx --no-install prisma generate --config prisma.integration.config.ts
      - name: Apply every migration
        run: npx --no-install prisma migrate deploy --config prisma.integration.config.ts
      - name: Configure application and identity roles
        shell: bash
        run: |
          set -euo pipefail
          name="codex-pg-$(node -e "process.stdout.write(require('node:crypto').randomBytes(6).toString('hex'))")"
          docker rename '${{ job.services.postgres.id }}' "$name"
          echo "INTEGRATION_DB_CONTAINER=$name" >> "$GITHUB_ENV"
          docker exec -i "$name" psql -v ON_ERROR_STOP=1 -U piling -d codex_test < scripts/app-role-grants.sql
          docker exec -i "$name" psql -v ON_ERROR_STOP=1 -U piling -d codex_test < scripts/identity-role-grants.sql
          app_password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$app_password"
          printf "ALTER ROLE pilingtrack_app PASSWORD '%s';\n" "$app_password" | docker exec -i "$name" psql -v ON_ERROR_STOP=1 -U piling -d codex_test
          echo "INTEGRATION_DATABASE_URL_APP=postgresql://pilingtrack_app:$app_password@127.0.0.1:5432/codex_test" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://pilingtrack_app:$app_password@127.0.0.1:5432/codex_test" >> "$GITHUB_ENV"
          echo "DATABASE_URL_POSTGRES=postgresql://pilingtrack_app:$app_password@127.0.0.1:5432/codex_test" >> "$GITHUB_ENV"
      - name: Build application
        run: npm run build
      # Одноразовое S3 для спека редактора плиток — тот же способ, что в integration.yml:
      # MinIO по TLS (самоподписанный сертификат на час), образ chainguard/minio по digest.
      - name: Start disposable S3 (MinIO over TLS)
        shell: bash
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/minio-certs"
          mkdir -p "$certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' -keyout "$certs/private.key" -out "$certs/public.crt"
          chmod 644 "$certs/private.key" "$certs/public.crt"
          s3_user="codex$(node -e "process.stdout.write(require('node:crypto').randomBytes(5).toString('hex'))")"
          s3_password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$s3_password"
          docker run -d --name "codex-minio-${{ github.run_id }}" --label pilingtrack.codex.test-s3=1 -p 127.0.0.1:9000:9000 -v "$certs:/certs:ro" -e MINIO_ROOT_USER="$s3_user" -e MINIO_ROOT_PASSWORD="$s3_password" -e MINIO_API_CORS_ALLOW_ORIGIN='*' chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8 server /tmp/data --certs-dir /certs
          for i in $(seq 1 30); do
            if curl -fsS --cacert "$certs/public.crt" https://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --cacert "$certs/public.crt" https://127.0.0.1:9000/minio/health/live >/dev/null
          {
            echo "export S3_ENDPOINT='https://127.0.0.1:9000'"
            echo "export S3_REGION='us-east-1'"
            echo "export S3_BUCKET='codex-photos'"
            echo "export S3_ACCESS_KEY_ID='$s3_user'"
            echo "export S3_SECRET_ACCESS_KEY='$s3_password'"
            echo "export NODE_EXTRA_CA_CERTS='$certs/public.crt'"
          } > "$RUNNER_TEMP/s3.env"
          chmod 600 "$RUNNER_TEMP/s3.env"
          ( set -a; . "$RUNNER_TEMP/s3.env"; set +a; node e2e/fixtures/disposable-s3.mjs )
          echo "E2E_S3_READY=true" >> "$GITHUB_ENV"
      - name: Start disposable application stand
        run: |
          set -euo pipefail
          set -a; . "$RUNNER_TEMP/s3.env"; set +a
          nohup npx --no-install next start -p 3100 -H 127.0.0.1 > stand-app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then cat stand-app.log; exit 1; fi
      # Исполнитель очередей (PDF отчётов, outbox, проекции). Без него сценарий
      # release-critical-path ждёт PDF и упирается в лимит запросов (первый запуск 16.10.2026).
      - name: Start disposable workers
        run: |
          set -euo pipefail
          set -a; . "$RUNNER_TEMP/s3.env"; set +a
          NODE_ENV=production nohup node --import tsx src/workers/unified-worker.ts > stand-workers.log 2>&1 &
          sleep 15
          if ! pgrep -f unified-worker >/dev/null; then cat stand-workers.log; exit 1; fi
      - name: Create disposable E2E accounts
        shell: bash
        run: |
          set -euo pipefail
          for role in ADMIN DISPATCHER OPERATOR ASSISTANT OPERATOR_B; do
            pw="$(node -e "process.stdout.write(require('node:crypto').randomBytes(20).toString('hex'))")"
            echo "::add-mask::$pw"
            echo "E2E_${role}_EMAIL=codex-$(echo "$role" | tr 'A-Z' 'a-z')@example.invalid" >> "$GITHUB_ENV"
            echo "E2E_${role}_PASSWORD=$pw" >> "$GITHUB_ENV"
          done
      - name: Seed E2E fixtures
        run: |
          set -euo pipefail
          node e2e/fixtures/disposable-seed.mjs
          node e2e/fixtures/disposable-to-seed.mjs
          node e2e/fixtures/disposable-extra-seed.mjs
      - name: Install Playwright browsers (chromium, webkit)
        run: npx playwright install --with-deps chromium webkit
      # Все основные сценарии на трёх профилях через HTTPS-прокси: боевая сборка
      # ставит Secure-куки, а WebKit не принимает их по http. Сценарии, которые
      # меняют данные, идут один раз в chromium (так устроены сами спеки).
      - name: Run all role scenarios on three profiles
        id: e2e
        env:
          BASE_URL: 'http://127.0.0.1:3100'
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -o pipefail
          set -a; . "$RUNNER_TEMP/s3.env"; set +a
          node e2e/fixtures/disposable-https.mjs node_modules/@playwright/test/cli.js test \
            --workers=1 --reporter=list,json,html \
            e2e/admin-dictionaries.spec.ts \
            e2e/admin-users.spec.ts \
            e2e/app.spec.ts \
            e2e/inspection-to-flow.spec.ts \
            e2e/monitoring-tile-editor.spec.ts \
            e2e/operator-report-smoke.spec.ts \
            e2e/orion-industrial-cinematic.spec.ts \
            e2e/rate-limit-e2e.spec.ts \
            e2e/release-critical-path.spec.ts \
            e2e/report-creation-flow.spec.ts \
            e2e/smoke-e2e.spec.ts \
            e2e/role-audit.spec.js
      - name: Summary for the run page
        if: always()
        shell: bash
        run: node scripts/e2e-summary.cjs playwright-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-results.json
            test-results/
            stand-app.log
            stand-workers.log
          if-no-files-found: warn
          retention-days: 14
