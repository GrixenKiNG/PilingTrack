name: Deploy to prod

# Manual-only. production must require the owner's review with admin bypass disabled.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character current main SHA with a successful CI run'
        required: true
        type: string
      external_workers_stopped:
        description: 'External standalone/systemd/pm2/other-host workers and their auto-restart have been stopped and verified'
        required: true
        default: false
        type: boolean
      services:
        description: 'Requested services (app and workers are always replaced together)'
        required: false
        default: 'app workers'
        type: choice
        options:
          - app
          - app workers
          - workers

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build SHA images + replace generation
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PROD_DEPLOY_OWNER != '' &&
      github.actor == vars.PROD_DEPLOY_OWNER &&
      github.triggering_actor == vars.PROD_DEPLOY_OWNER
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_SHA: ${{ inputs.sha }}

    steps:
      - name: Confirm external worker barrier
        env:
          CONFIRMED: ${{ inputs.external_workers_stopped }}
          SERVICES: ${{ inputs.services }}
        run: |
          [ "$CONFIRMED" = true ] || { echo '::error::Stop and verify all external workers before deployment'; exit 1; }
          case "$SERVICES" in app|workers|"app workers") ;; *) echo '::error::Unknown service'; exit 1 ;; esac

      - name: Verify CI for requested SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Provide a full lowercase commit SHA'; exit 1; }
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&branch=main&event=push&per_page=1")
          echo "$RUNS" | jq -e --arg sha "$DEPLOY_SHA" '
            .workflow_runs[0] |
            .head_sha == $sha and .head_branch == "main" and .event == "push" and
            .status == "completed" and .conclusion == "success"
          ' > /dev/null || { echo '::error::Latest CI run for this SHA on main has not passed'; exit 1; }

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify main SHA
        run: |
          git fetch origin main
          [ "$(git branch --show-current)" = main ] || { echo '::error::Checkout must be main'; exit 1; }
          git diff --quiet && git diff --cached --quiet || { echo '::error::Working tree is dirty'; exit 1; }
          [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] && [ "$(git rev-parse origin/main)" = "$DEPLOY_SHA" ] || { echo '::error::Requested SHA must equal current main and origin/main'; exit 1; }

      - name: Build SHA images + workers smoke
        run: |
          docker build -f Dockerfile.workers --target runner --build-arg "APP_VERSION=$DEPLOY_SHA" -t "pilingtrack-workers:$DEPLOY_SHA" .
          bash scripts/smoke-workers-image.sh "pilingtrack-workers:$DEPLOY_SHA"
          docker build -f Dockerfile --target runner --build-arg "APP_VERSION=$DEPLOY_SHA" -t "pilingtrack-app:$DEPLOY_SHA" .
          # Always ship the lightweight migrate target so migrations cannot use a stale image.
          docker build -f Dockerfile --target migrate -t "pilingtrack-migrate:$DEPLOY_SHA" .

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$SSH_KNOWN_HOSTS" ] || { echo '::error::Configure production SSH key and verified host key'; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Save rollback images
        run: |
          ssh -i ~/.ssh/id -o BatchMode=yes -o StrictHostKeyChecking=yes user1@87.242.102.125 bash -se -- "$DEPLOY_SHA" <<'REMOTE'
            DEPLOY_SHA=$1
            cd /opt/pilingtrack
            git fetch origin main
            [ "$(git branch --show-current)" = main ] || { echo 'Server checkout must be main'; exit 1; }
            git diff --quiet && git diff --cached --quiet || { echo 'Server working tree is dirty'; exit 1; }
            [ "$(git rev-parse origin/main)" = "$DEPLOY_SHA" ] || { echo 'Requested SHA is no longer origin/main'; exit 1; }
            ROLLBACK="$(git rev-parse HEAD)-$(date +%Y%m%d)"
            for s in app workers; do
              old_image=$(docker inspect --format '{{.Image}}' "pilingtrack-$s")
              docker tag "$old_image" "pilingtrack-$s:$ROLLBACK"
            done
            df -h /
          REMOTE

      - name: Transfer SHA images
        run: |
          docker save "pilingtrack-app:$DEPLOY_SHA" "pilingtrack-workers:$DEPLOY_SHA" "pilingtrack-migrate:$DEPLOY_SHA" | gzip -1 | \
            ssh -i ~/.ssh/id -o BatchMode=yes -o StrictHostKeyChecking=yes user1@87.242.102.125 'bash -o pipefail -c "gunzip | docker load"'

      - name: Switch main + replace generation
        run: |
          ssh -i ~/.ssh/id -o BatchMode=yes -o StrictHostKeyChecking=yes user1@87.242.102.125 bash -se -- "$DEPLOY_SHA" <<'REMOTE'
            DEPLOY_SHA=$1
            cd /opt/pilingtrack
            git fetch origin main
            [ "$(git branch --show-current)" = main ] || { echo 'Server checkout must be main'; exit 1; }
            git diff --quiet && git diff --cached --quiet || { echo 'Server working tree is dirty'; exit 1; }
            [ "$(git rev-parse origin/main)" = "$DEPLOY_SHA" ] || { echo 'Requested SHA is no longer origin/main'; exit 1; }
            git merge --ff-only origin/main
            [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || exit 1
            for s in app workers migrate; do
              docker tag "pilingtrack-$s:$DEPLOY_SHA" "pilingtrack-$s:latest"
            done
            export APP_VERSION="$DEPLOY_SHA"
            WORKER_GENERATION_EXTERNAL_STOPPED=1 bash scripts/replace-worker-generation.sh app workers
          REMOTE

      - name: Verify health + deployed SHA
        run: |
          EXPECTED="$DEPLOY_SHA"
          echo "Expected version: $EXPECTED"
          for i in $(seq 1 30); do
            if BODY=$(curl --connect-timeout 3 --max-time 5 -sf https://orionpiling.ru/api/health); then
              ACTUAL=$(echo "$BODY" | jq -r '.version // empty' 2>/dev/null || true)
              # All service choices replace app+workers, so always verify app SHA.
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                exit 0
              fi
              echo "Waiting for version '$EXPECTED'; health reports '$ACTUAL' (attempt $i/30)"
            fi
            sleep 3
          done
          echo '::error::Health did not report the requested SHA after 30 attempts'
          exit 1
