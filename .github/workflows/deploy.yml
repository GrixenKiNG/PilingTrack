name: Deploy to prod

# Manual-only — no auto-deploy on push.
# Triggered from GitHub UI: Actions → Deploy to prod → Run workflow.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA on main with a successful CI run'
        required: true
        type: string
      external_workers_stopped:
        description: 'External standalone/systemd/pm2/other-host workers and their auto-restart have been stopped and verified'
        required: true
        default: false
        type: boolean
      services:
        description: 'Services to redeploy (space-separated)'
        required: false
        default: 'app workers'
        type: choice
        options:
          - app
          - app workers
          - workers

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: SSH + rebuild + restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.sha }}

    steps:
      - name: Confirm external worker barrier
        env:
          CONFIRMED: ${{ inputs.external_workers_stopped }}
          SERVICES: ${{ inputs.services }}
        run: |
          [ "$CONFIRMED" = true ] || { echo '::error::Stop and verify all external workers before deployment'; exit 1; }
          case "$SERVICES" in app|workers|"app workers") ;; *) echo '::error::Unknown service'; exit 1 ;; esac

      - name: Verify CI for requested SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Provide a full lowercase commit SHA'; exit 1; }
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&branch=main&event=push&per_page=1")
          echo "$RUNS" | jq -e --arg sha "$DEPLOY_SHA" '
            .workflow_runs[0] |
            .head_sha == $sha and .head_branch == "main" and .event == "push" and
            .status == "completed" and .conclusion == "success"
          ' > /dev/null || { echo '::error::Latest CI run for this SHA on main has not passed'; exit 1; }

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H 87.242.102.125 >> ~/.ssh/known_hosts

      - name: Checkout, rebuild, restart
        env:
          SERVICES: ${{ inputs.services }}
        run: |
          # $SERVICES expands here (runner); \$VARS evaluate on the prod host.
          ssh -i ~/.ssh/id user1@87.242.102.125 "
            set -e
            cd /opt/pilingtrack
            BEFORE=\$(git rev-parse HEAD)
            # Preserve actual running image IDs before build changes :latest.
            ROLLBACK=\"\$BEFORE-\$(date +%Y%m%d)\"
            for s in app workers; do
              old_image=\$(docker inspect --format '{{.Image}}' \"pilingtrack-\$s\")
              docker tag \"\$old_image\" \"pilingtrack-\$s:\$ROLLBACK\"
            done
            git fetch origin main
            git merge-base --is-ancestor '$DEPLOY_SHA' origin/main
            git checkout --detach '$DEPLOY_SHA'
            export APP_VERSION='$DEPLOY_SHA'
            SVCS=\"app workers\"
            # A new Prisma migration means the 'migrate' image must be rebuilt
            # too — it bakes prisma/migrations at build time, so building only
            # app/workers would run 'migrate deploy' on a stale image and
            # silently skip the migration (runbook 008). Auto-include it.
            if git diff --name-only --diff-filter=A \"\$BEFORE\"..HEAD -- 'prisma/migrations/**' | grep -q .; then
              echo '>> New migration detected — adding migrate to the build set'
              SVCS=\"migrate \$SVCS\"
            fi
            df -h /
            # Build sequentially with a prune between — a parallel build fills
            # the 30 GB VPS disk to 100% (reference_prod_deploy_disk).
            for s in \$SVCS; do
              echo \">> Building \$s\"
              docker compose build \"\$s\"
              docker builder prune -f || true
            done
            # Smoke именно построенного образа; до замены работающих сервисов.
            case \" \$SVCS \" in
              *\" workers \"*)
                WORKERS_IMAGE=''
                for image in \$(docker compose config --images workers); do
                  service=\$(docker image inspect --format '{{ index .Config.Labels \"com.docker.compose.service\" }}' \"\$image\" 2>/dev/null || true)
                  if [ \"\$service\" = workers ]; then
                    WORKERS_IMAGE=\"\$image\"
                    break
                  fi
                done
                [ -n \"\$WORKERS_IMAGE\" ] || exit 1
                bash scripts/smoke-workers-image.sh \"\$WORKERS_IMAGE\"
                ;;
            esac
            WORKER_GENERATION_EXTERNAL_STOPPED=1 bash scripts/replace-worker-generation.sh app workers
          "

      - name: Verify health + deployed SHA
        run: |
          EXPECTED="$DEPLOY_SHA"
          echo "Expected version: $EXPECTED"
          for i in $(seq 1 30); do
            if BODY=$(curl --connect-timeout 3 --max-time 5 -sf https://orionpiling.ru/api/health); then
              ACTUAL=$(echo "$BODY" | jq -r '.version // empty' 2>/dev/null || true)
              # All service choices replace app+workers, so always verify app SHA.
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                exit 0
              fi
              echo "Waiting for version '$EXPECTED'; health reports '$ACTUAL' (attempt $i/30)"
            fi
            sleep 3
          done
          echo '::error::Health did not report the requested SHA after 30 attempts'
          exit 1
