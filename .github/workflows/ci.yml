name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Test env: random secrets so encryption module loads cleanly.
      # (Tests that exercise the encryption module override these per-test.)
      ENCRYPTION_KEY: '11111111111111111111111111111111111111111111111111111111111111ab'
      SESSION_SECRET: 'ci-session-secret-32-bytes-minimum-length-for-validation-xx'
      DEVICE_KEY_LOOKUP_SECRET: 'ci-device-secret-base64-padding-here-1234567890abcdefghijklmn=='
      DATABASE_URL: 'postgresql://stub:stub@localhost:5432/stub'
      # prisma.config.ts resolves env('DATABASE_URL_POSTGRES') at load time
      # and throws if it's absent — even for `prisma generate`, which never
      # connects. The postinstall hook (npm run db:generate) runs during
      # `npm ci`, so without this stub the whole job dies at "Install deps".
      DATABASE_URL_POSTGRES: 'postgresql://stub:stub@localhost:5432/stub'
      REDIS_URL: 'redis://localhost:6379'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        # Tests import generated types; run generate but skip migrations
        # (no DB in this job — unit tests mock @/lib/db).
        run: npm run db:generate

      - name: Lint
        # Re-enabled 2026-05-31: the old eslint 10 / eslint-plugin-react crash
        # is gone — the stack is now eslint 9 + flat config (eslint.config.mjs)
        # via eslint-config-next 16. `npm run lint` is clean (0 errors; ~684
        # warnings are allowed and don't fail the gate).
        run: npm run lint

      - name: Typecheck
        # Use plain tsc here, not `npm run typecheck` — that one wraps a full
        # next build which is too heavy for the lint-and-tests gate.
        run: npx tsc --noEmit

      - name: Layer boundaries
        # Catches new core→services / modules→app / cross-module imports.
        # Existing violations are grandfathered in
        # scripts/.layer-boundaries-baseline.txt — see the script for how
        # to update after intentional cleanup.
        run: npx tsx scripts/check-layer-boundaries.ts

      - name: Migration guard
        # Fails the build on an un-reviewed DROP COLUMN / DROP TABLE / TRUNCATE
        # in prisma/migrations. Pure file scan, no DB. Reviewed destructive
        # migrations are allowlisted in scripts/.migration-guard-baseline.txt.
        # Prompted by the 2026-05-30 incident (a stray autogenerated DROP
        # COLUMN shipped unread). Was local-only via `npm run verify`; this
        # makes it a hard gate on every push/PR.
        run: npm run db:check-migrations

      - name: Workers no-next guard
        # Отдельный прогон падает и при исчезнувшем файле/нуле тестов.
        run: npx vitest run src/workers/__tests__/no-next-in-workers.test.ts

      - name: Unit tests
        # Unit and contract checks; database-backed suites run below.
        run: npx vitest run src/ tests/contract --coverage --maxWorkers=2

  workers-smoke:
    name: Workers image + startup smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build workers runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workers
          target: runner
          load: true
          tags: pilingtrack-workers:smoke
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers

      - name: Smoke workers image
        run: bash scripts/smoke-workers-image.sh pilingtrack-workers:smoke

  # Validates that Prisma migrations apply cleanly on a real Postgres.
  # This catches a class of bugs that pure-mock unit tests miss:
  # syntax that Prisma's parser accepts but Postgres rejects,
  # ordering issues, and RLS policies that need DB state to compile.
  #
  # Integration suites create disposable databases on this Postgres service.
  schema-validation:
    name: Schema + migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pilingtrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pilingtrack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/pilingtrack_ci?schema=public'
      DATABASE_URL_POSTGRES: 'postgresql://postgres:postgres@localhost:5432/pilingtrack_ci?schema=public'
      # Непривилегированная роль приложения. Без неё набор про изоляцию
      # тенантов пропускается молча — под суперпользователем RLS не работает
      # вовсе, и проверять было бы нечего. Пароль здесь одноразовый, база
      # живёт только внутри job.
      DATABASE_URL_APP_ROLE: 'postgresql://pilingtrack_app:ci_app_role_pw@localhost:5432/pilingtrack_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      SESSION_SECRET: 'ci-session-secret-32-bytes-minimum-length-for-validation-xx'
      ENCRYPTION_KEY: '11111111111111111111111111111111111111111111111111111111111111ab'
      DEVICE_KEY_LOOKUP_SECRET: 'ci-device-secret-base64-padding-here-1234567890abcdefghijklmn=='
      NEXT_TELEMETRY_DISABLED: '1'
      SKIP_SEED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Validates migrations against a real Postgres — this is the
      # check that was missing from the audit (CI was on SQLite stubs).
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      # Smoke-check that migrations produced the expected schema —
      # cheap insurance against a silently-empty migration.
      - name: Verify schema applied
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d pilingtrack_ci \
            -tAc "select count(*) from information_schema.tables where table_schema='public'" \
            | awk '{ if ($1 < 30) { print "FAIL: only " $1 " tables, expected >= 30"; exit 1 } else { print "OK: " $1 " tables" } }'

      # Роль приложения без BYPASSRLS — та же, что на проде (ранбук 011).
      # Заводится ПОСЛЕ миграций: гранты выдаются на уже существующие таблицы.
      - name: Create unprivileged app role
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres             -d pilingtrack_ci -f scripts/app-role-grants.sql
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres             -d pilingtrack_ci -c "ALTER ROLE pilingtrack_app WITH PASSWORD 'ci_app_role_pw';"

      - name: Database integration tests
        run: npx vitest run tests/integration

      # Набор про изоляцию тенантов гейтится на DATABASE_URL_APP_ROLE и при
      # её отсутствии пропускается МОЛЧА — прогон остаётся зелёным, ничего не
      # проверив. Так и было до 22.09.2026. Здесь пропуск объявляется падением.
      - name: RLS isolation suite must actually run
        run: |
          if npx vitest run tests/integration/rls-tenant-enforcement.spec.ts > rls.log 2>&1; then
            EXIT=0
          else
            EXIT=$?
          fi
          cat rls.log
          if [ "$EXIT" -ne 0 ]; then exit "$EXIT"; fi
          if grep -qE '[0-9]+ skipped' rls.log; then
            echo "FAIL: набор про изоляцию тенантов пропущен, а не выполнен"
            exit 1
          fi

      # Ещё пять наборов гейтятся на DATABASE_URL_POSTGRES (runIf/skipIf) и при
      # её отсутствии тоже исчезают МОЛЧА — прогон остаётся зелёным, ничего не
      # проверив (R81, находка 4). Переменная задана в env этого job, так что
      # гейт открыт; здесь пропуск объявляется падением. Файлы с законными
      # describe.skip (tech-readiness-write-pipeline, contract/tech-readiness-api)
      # сюда не входят — иначе страж срабатывал бы ложно.
      - name: DB-gated readiness suites must actually run
        run: |
          if npx vitest run \
            tests/integration/tech-readiness-projection.spec.ts \
            tests/integration/tech-readiness-shifts.spec.ts \
            tests/integration/tech-readiness-work-permits.spec.ts \
            tests/integration/tenant-dictionary-migration.spec.ts \
            tests/integration/tenant-transaction-pool.spec.ts > db-gated.log 2>&1; then
            EXIT=0
          else
            EXIT=$?
          fi
          cat db-gated.log
          if [ "$EXIT" -ne 0 ]; then exit "$EXIT"; fi
          if grep -qE '[0-9]+ skipped' db-gated.log; then
            echo "FAIL: наборы техготовности/тенанта пропущены, а не выполнены (проверьте DATABASE_URL_POSTGRES)"
            exit 1
          fi

  # Браузерные E2E (golden path + семь ролей) перенесены в integration.yml:
  # спеки рассчитаны на одноразовый стенд (учётки codex-<роль>, роль pilingtrack_app,
  # контейнер codex-pg-<hex>), а не на seed.ts — здесь они падали на входе с июля.
