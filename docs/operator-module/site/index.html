<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Модуль оператора — интерактивный просмотр</title>
<link rel="stylesheet" href="operator-module.css">
<link rel="stylesheet" href="extra.css">
<style>
  html, body { margin: 0; background: #eef1f5; }
  body { font-family: "Inter", "Segoe UI", system-ui, Arial, sans-serif; color: #16324f; }
  .pt .viewer { display: flex; min-height: 100vh; }
  .rail {
    width: 320px; flex: 0 0 320px; background: #0d2b4e; color: #cfe0f2;
    overflow-y: auto; max-height: 100vh; padding-bottom: 24px;
  }
  .rail-title { padding: 18px 18px 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: #7fa6cf; }
  .rail-group { padding: 14px 18px 6px; font-size: 11.5px; font-weight: 700; color: #8fb4d8;
    text-transform: uppercase; letter-spacing: .04em; }
  .rail-item { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center;
    width: 100%; text-align: left; background: transparent; border: 0; color: #dce9f6;
    padding: 8px 18px; font: inherit; font-size: 12.5px; cursor: pointer; border-left: 3px solid transparent; }
  .rail-item:hover { background: rgba(255,255,255,.06); }
  .rail-item.on { background: rgba(31,111,235,.22); border-left-color: #4f9bf0; }
  .rail-item .rn { color: #7fa6cf; font-size: 11px; }
  .rail-item .rk { color: #7fa6cf; font-size: 10.5px; }
  .stage { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 26px; }
  .stage-inner { display: flex; justify-content: center; }
  .stage-nav { display: flex; align-items: center; gap: 16px; }
  .stage-nav button { background: #0d2b4e; color: #fff; border: 0; border-radius: 9px;
    padding: 9px 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .stage-nav button:hover { background: #1565c0; }
  .stage-nav .pos { font-size: 13px; color: #5b6b7c; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: #7b8794; }
</style>
</head>
<body class="pt">
<div id="app-root"></div>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="screens-tb.js"></script>
<script src="screens-1.js"></script>
<script src="screens-2.js"></script>
<script src="screens-3.js"></script>
<script src="screens-4.js"></script>
<script src="app.js"></script>
<script>PT_READY();</script>
</body>
</html>
